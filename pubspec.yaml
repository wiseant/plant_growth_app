name: plant_growth
description: "植物生长模拟 App（运行时抽帧方案）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # 播放成熟动画
  video_player: ^2.9.1

  # 启动资源下载 + 磁盘缓存
  flutter_cache_manager: ^3.4.1

  # 远程配置拉取
  http: ^1.2.2

  path: ^1.9.0
  path_provider: ^2.1.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/plants/plants.json
